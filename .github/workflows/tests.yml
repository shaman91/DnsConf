name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
          cache-dependency-path: |
            pom.xml
            .github/workflows/tests.yml

      - name: Test CI retry policy
        run: python3 scripts/test_ci_retry.py

      - name: Run tests
        run: mvn -B test
