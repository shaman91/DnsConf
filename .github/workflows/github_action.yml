name: DNS Block&Redirect Configurer cron task

on:
  pull_request:
  schedule:
    - cron: '30 1 * * *' # 04:30 MSK (01:30 UTC)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: DNS

    env:
      DNS: ${{ vars.DNS }}
      BLOCK: ${{ vars.BLOCK }}
      REDIRECT: ${{ vars.REDIRECT }}
      EXCLUDE_REDIRECT: ${{ vars.EXCLUDE_REDIRECT }}
      PRUNE_REDIRECT: 'true'
      COMPACT_REDIRECT: 'true'
      DONOR_DNS: ${{ vars.DONOR_DNS }}

      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

      TZ: Europe/Moscow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
          cache-dependency-path: |
            pom.xml
            .github/workflows/github_action.yml

      - name: Build with Maven
        shell: bash
        run: |
          # Retry dependency-transfer throttling only; never retry DNS application.
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/maven-build-$attempt.log"
            if mvn -B -V clean package >"$log" 2>&1; then
              cat "$log"
              exit 0
            else
              status=$?
            fi
            cat "$log"
            if (( attempt == 3 )) ||
               ! grep -Eq '^\[ERROR\].*Could not transfer (artifact|metadata).*status code: 429([,[:space:]]|$)' "$log"; then
              exit "$status"
            fi
            echo "::warning::Maven Central throttled a dependency transfer; retrying in $((attempt * 60)) seconds."
            sleep "$((attempt * 60))"
          done

      - name: Run application
        if: github.event_name != 'pull_request'
        run: |
          echo "Starting application..."
          java --enable-preview -jar target/*.jar
